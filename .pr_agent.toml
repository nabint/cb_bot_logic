[config]

# MODEL
model = "ollama/deepseek-r1-16k"
fallback_models = ["ollama/deepseek-r1-16k"]

temperature = 0.0
seed = 42

# MAX CONTEXT FOR DEEP REVIEW
custom_model_max_tokens = 24000
max_model_tokens = 28000
model_token_count_estimate_factor = 0.9

publish_output = true
publish_output_progress = true

# Enable examples
duplicate_prompt_examples = true

verbosity_level = 3

use_repo_settings_file = true
use_global_settings_file = false
use_wiki_settings_file = false

# OLLAMA SETTINGS
custom_reasoning_model = false
ai_timeout = 7200

# PATCH HANDLING
allow_dynamic_context = true

large_patch_policy = "split"

max_commits_tokens = 8000
max_description_tokens = 4000

# Increase context around changes
max_extra_files = 30
patch_extra_lines_before = 30
patch_extra_lines_after = 30

patch_extension_skip_types = [".lock"]

# ANALYSIS QUALITY
enable_ai_metadata = true
reasoning_effort = "high"

# enable_ai_metadata = true
dump_prompts = true
# verbosity_level = 3

log_level = "DEBUG"


[context]
enabled = true
max_context_tokens = 12000

# SMART PATCH STRATEGY
patch_strategy = "smart"


# PYTHON-SPECIFIC REVIEW
[pr_reviewer]

require_security_review = true
require_tests_review = true
require_todo_scan = true

num_max_findings = 25

final_update_message = true
persistent_comment = true

enable_review_labels_effort = true
enable_review_labels_security = true

# Multi-pass reasoning
max_ai_calls = 6
max_number_of_calls = 6


# PYTHON-SPECIFIC PROMPT
extra_instructions = """ """


# PR DESCRIPTION
[pr_description]

enable_help_text = true
publish_labels = true
generate_ai_title = true
enable_pr_diagram = false

use_bullet_points = true
enable_pr_type = true

# Sequential only 
async_ai_calls = false

# Multi-pass reasoning
max_ai_calls = 8
max_number_of_calls = 7


# QUESTIONS
[pr_questions]

enable_help_text = true
use_conversation_history = true


# CODE SUGGESTIONS
[pr_code_suggestions]

commitable_code_suggestions = false

focus_only_on_problems = false

max_number_of_calls = 6
parallel_calls = false

publish_output_no_suggestions = true
suggestions_score_threshold = 6

# IMPORTANT FOR LOCAL MODEL
self_reflect_on_suggestions = true


# GITHUB
[github]

deployment_type = "user"

ratelimit_retries = 10

publish_inline_comments_fallback_with_verification = true
try_fix_invalid_inline_comments = true


# GITHUB ACTION
[github_action_config]

auto_review = true
auto_describe = true
auto_improve = true

handle_push_trigger = true


# LITELLM
[litellm]
enable_callbacks = true
