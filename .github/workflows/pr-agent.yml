name: Qodo PR Agent (Ollama)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    name: Run PR Agent
    runs-on: self-hosted

    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PR-Agent
        env:
          PYTHONPATH: /home/teslatech/pr-agent
          CONFIG__GIT_PROVIDER: github
          CONFIG__USE_REPO_SETTINGS_FILE: "true"   # ← enables .pr_agent.toml at root
          OLLAMA__API_BASE: http://localhost:11434
          GITHUB__USER_TOKEN: ${{ secrets.PR_AGENT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PR_AGENT_TOKEN }}
        run:
          /home/teslatech/pr-agent/qodo_venv/bin/python -m pr_agent.servers.github_action_runner