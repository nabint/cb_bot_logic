name: Qodo PR Agent (Ollama)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    name: Run PR Agent
    runs-on: self-hosted

    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Install PR-Agent

      #   run: 
      #     source /home/teslatech/pr-agent/qodo_venv/bin/activate
      #     pip install pr-agent

      - name: Run PR-Agent
        working-directory: /home/teslatech/pr-agent
        env:
          CONFIG__GIT_PROVIDER: github
          CONFIG__MODEL: ollama/qwen2.5-coder:14b
          CONFIG__FALLBACK_MODELS: '["ollama/qwen2.5-coder:14b"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "12000"
          CONFIG__DUPLICATE_EXAMPLES: "true"
          CONFIG__USE_REPO_SETTINGS_FILE: "false"
          CONFIG__USE_EXTRA_BAD_EXTENSIONS: "false"
          CONFIG__PUBLISH_OUTPUT: "true"
          CONFIG__PUBLISH_OUTPUT_PROGRESS: "true"
          CONFIG__ENABLE_CUSTOM_LABELS: "false"
          GITHUB__RATELIMIT_RETRIES: "5"
          OLLAMA__API_BASE: http://localhost:11434
          GITHUB__USER_TOKEN: ${{ secrets.PR_AGENT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PR_AGENT_TOKEN }}
        run:
          qodo_venv/bin/python -m pr_agent.servers.github_action_runner